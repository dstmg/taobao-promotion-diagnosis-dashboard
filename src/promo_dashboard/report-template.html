<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>推广投产分析看板</title>
<style>
:root{--blue:#4568f5;--blue2:#eff2ff;--ink:#172033;--muted:#71809b;--line:#e4e9f4;--surface:#fff;--canvas:#f5f7fc;--green:#16845b;--green-bg:#e9f7f0;--red:#c84646;--red-bg:#fff0ef;--amber:#9c6814;--amber-bg:#fff7e8;--shadow:0 14px 40px #23366114}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.55 "Microsoft YaHei",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.side{position:fixed;inset:0 auto 0 0;width:250px;background:#fff;border-right:1px solid var(--line);padding:24px 16px;overflow:auto;z-index:2}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;margin:2px 8px 30px}.brand-mark{width:32px;height:32px;border-radius:11px;background:var(--blue);color:white;display:grid;place-items:center;box-shadow:0 5px 14px #4568f544}.nav-label{margin:20px 10px 8px;color:#98a3b8;font-size:11px;letter-spacing:.08em}.nav{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;margin:3px 0;border:0;border-radius:10px;background:transparent;color:#5d6c86;text-align:left}.nav:hover{background:#f6f7ff}.nav.active{background:var(--blue2);color:var(--blue);font-weight:700}.nav .num{width:23px;color:#9aa7bf;font-size:11px}.nav.active .num{color:var(--blue)}.side-foot{position:fixed;bottom:12px;width:218px;border-top:1px solid var(--line);padding:12px 4px 0;color:var(--muted);font-size:11px}.main{margin-left:250px;padding:26px 34px 52px;max-width:1900px}.hero{border-radius:18px;background:linear-gradient(110deg,#4666f4,#8896ff);color:white;padding:24px 30px;box-shadow:0 12px 28px #506cf32b}.eyebrow{font-size:11px;opacity:.8}.hero h1{font-size:25px;line-height:1.35;margin:5px 0}.hero p{margin:4px 0 0;opacity:.88}.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;margin-top:18px}.panel h2{font-size:17px;margin:0 0 4px}.sub{color:var(--muted);font-size:12px;margin:0 0 14px}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.field,select{height:38px;border:1px solid #dce3f1;background:white;color:var(--ink);border-radius:10px;padding:0 11px;outline:none}.field:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #4568f51a}.btn{height:37px;padding:0 14px;border:1px solid #dce3f1;background:white;border-radius:10px;color:#52627d}.btn:hover{border-color:#aab8ef;color:var(--blue)}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.filterbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px;background:#f8f9ff;border:1px solid var(--line);border-radius:13px;margin:14px 0}.filterbar .field.search{min-width:220px;flex:1}.kpis{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px;margin:14px 0}.kpi{border:1px solid var(--line);border-radius:12px;padding:14px;background:white}.kpi label{display:block;color:var(--muted);font-size:11px}.kpi strong{display:block;font-size:20px;margin-top:4px;white-space:nowrap}.kpi small{color:var(--muted);font-size:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.notice{padding:12px 14px;border:1px solid #dce4ff;border-left:4px solid var(--blue);background:#f7f8ff;border-radius:10px;color:#455d99;font-size:12px;margin:12px 0}.findings{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:9px}.finding{border:1px solid var(--line);border-radius:11px;padding:12px}.finding strong{display:block;margin-bottom:3px}.finding p{margin:0;color:var(--muted);font-size:12px}.finding.alert{border-color:#ffd6d1;background:var(--red-bg)}.finding.watch{border-color:#f2dfb9;background:var(--amber-bg)}.finding.good{border-color:#c8ebdc;background:var(--green-bg)}.finding.info{background:#f6f8fc}.filters-grid{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.filters-grid label{font-size:11px;color:#687793;background:#f8f9fc;border:1px solid var(--line);border-radius:8px;padding:5px 8px;display:flex;gap:6px;align-items:center}.filters-grid input{accent-color:var(--blue)}.table-wrap{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:64vh;background:white}.data-table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12px}.data-table th,.data-table td{padding:11px 13px;border-bottom:1px solid #edf0f6;text-align:right;white-space:nowrap}.data-table th{position:sticky;top:0;z-index:1;background:#f7f8fc;color:#4f5f7b;font-weight:700}.data-table th:first-child,.data-table td:first-child{text-align:left}.data-table th.dim,.data-table td.dim{text-align:left;max-width:240px;white-space:normal}.data-table th.sort{cursor:pointer}.data-table th.sort:hover{color:var(--blue)}.data-table tbody tr:hover{background:#f5f6ff}.metric-good{color:var(--green);font-weight:700}.metric-bad{color:var(--red);font-weight:700}.metric-watch{color:var(--amber);font-weight:700}.empty{padding:34px;text-align:center;color:var(--muted)}.badge{display:inline-block;border-radius:6px;padding:2px 7px;font-size:10px;background:#eef1f7;color:#64718b}.badge.good{background:var(--green-bg);color:var(--green)}.badge.alert{background:var(--red-bg);color:var(--red)}.badge.watch{background:var(--amber-bg);color:var(--amber)}.section-title{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.meta{font-size:11px;color:var(--muted)}.small-note{font-size:11px;color:var(--muted);margin-top:8px}.links-list{display:grid;gap:7px}.link-row{display:grid;grid-template-columns:minmax(180px,1.3fr) minmax(140px,1fr) repeat(3,minmax(100px,.7fr)) auto;gap:12px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}.link-row:hover{border-color:#becaff;background:#fafbff}.link-name{font-weight:700}.link-sub{font-size:11px;color:var(--muted)}.modal-backdrop{position:fixed;inset:0;background:#1720338c;backdrop-filter:blur(5px);z-index:10;display:none;align-items:center;justify-content:center;padding:2vh 2vw}.modal-backdrop.open{display:flex}.modal{width:min(96vw,1800px);height:min(94vh,1200px);background:#fff;border-radius:16px;box-shadow:0 25px 90px #0004;display:flex;flex-direction:column;overflow:hidden}.modal-head{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line);padding:13px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.modal-head strong{font-size:15px}.modal-body{padding:14px 18px;overflow:auto;flex:1}.modal-body .table-wrap{max-height:none;overflow:auto}.modal-body .data-table th{top:0}.modal-close{width:36px;height:36px;border:1px solid var(--line);background:white;border-radius:9px;color:#62718b}.mobile-menu{display:none}.chart{height:90px;width:100%;display:block}.chart-label{font-size:10px;fill:#8b98ad}.footer{padding:14px 2px;color:var(--muted);font-size:11px}.hidden{display:none!important}
.modal-body .table-wrap{max-height:calc(94vh - 130px);overflow:auto}
@media(max-width:1150px){.side{width:210px}.main{margin-left:210px;padding:20px}.side-foot{width:178px}.kpis{grid-template-columns:repeat(3,minmax(110px,1fr))}.link-row{grid-template-columns:1fr 1fr 1fr}.link-row>:nth-child(n+4){display:none}}
@media(max-width:740px){.side{position:sticky;inset:0 0 auto;width:100%;height:auto;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto;gap:5px}.brand{display:none}.nav-label,.side-foot{display:none}.nav{width:auto;min-width:max-content;margin:0;padding:8px 10px}.nav .num{display:none}.main{margin:0;padding:14px}.hero{padding:18px}.hero h1{font-size:20px}.kpis{grid-template-columns:repeat(2,minmax(120px,1fr))}.two{grid-template-columns:1fr}.panel{padding:14px}.modal-backdrop{padding:0}.modal{width:100vw;height:100dvh;border-radius:0}.link-row{grid-template-columns:1fr 1fr}.link-row>:nth-child(n+3){display:none}}
__DASHBOARD_CSS__
</style>
</head>
<body>
<aside class="side"><div class="brand"><span class="brand-mark">直</span><span>推广诊断工作台</span></div><div class="nav-label">分析目录</div><div id="nav"></div><div class="side-foot">本地生成 · 数据仅来自用户上传的报表</div></aside>
<main class="main"><header class="hero"><div class="topline"><div><div class="eyebrow">淘宝 / 天猫推广分析 · 本地单文件报告</div><h1>推广投产分析看板</h1><p id="hero-meta"></p></div><span class="badge" style="background:#ffffff2b;color:white">离线可查看</span></div></header><div id="app"></div><div class="footer">指标按当前所选单份报表汇总；不同维度报表属于并列观察口径，不能互相相加。直接 ROI = 直接成交金额 ÷ 花费，不代表利润。</div></main>
<div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true"><div class="modal"><div class="modal-head"><strong id="modal-title">悬浮查看</strong><button class="modal-close" id="modal-close" aria-label="关闭">×</button></div><div class="modal-body" id="modal-body"></div></div></div>
<script type="application/json" id="report-data">__REPORT_DATA__</script>
<script>__DASHBOARD_JS__</script>
</body></html>
