focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #4568f51a}.btn{height:37px;padding:0 14px;border:1px solid #dce3f1;background:white;border-radius:10px;color:#52627d}.btn:hover{border-color:#aab8ef;color:var(--blue)}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.filterbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px;background:#f8f9ff;border:1px solid var(--line);border-radius:13px;margin:14px 0}.filterbar .field.search{min-width:220px;flex:1}.kpis{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px;margin:14px 0}.kpi{border:1px solid var(--line);border-radius:12px;padding:14px;background:white}.kpi label{display:block;color:var(--muted);font-size:11px}.kpi strong{display:block;font-size:20px;margin-top:4px;white-space:nowrap}.kpi small{color:var(--muted);font-size:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.notice{padding:12px 14px;border:1px solid #dce4ff;border-left:4px solid var(--blue);background:#f7f8ff;border-radius:10px;color:#455d99;font-size:12px;margin:12px 0}.findings{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:9px}.finding{border:1px solid var(--line);border-radius:11px;padding:12px}.finding strong{display:block;margin-bottom:3px}.finding p{margin:0;color:var(--muted);font-size:12px}.finding.alert{border-color:#ffd6d1;background:var(--red-bg)}.finding.watch{border-color:#f2dfb9;background:var(--amber-bg)}.finding.good{border-color:#c8ebdc;background:var(--green-bg)}.finding.info{background:#f6f8fc}.filters-grid{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.filters-grid label{font-size:11px;color:#687793;background:#f8f9fc;border:1px solid var(--line);border-radius:8px;padding:5px 8px;display:flex;gap:6px;align-items:center}.filters-grid input{accent-color:var(--blue)}.table-wrap{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:64vh;background:white}.data-table{border-collapse:separate;border-spacing:0;width:max- :3;background:#fff;border-bottom:1px solid var(--line);padding:13px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.modal-head strong{font-size:15px}.modal-body{padding:14px 18px;overflow:auto;flex:1}.modal-body .table-wrap{max-height:none;overflow:auto}.modal-body .data-table th{top:0}.modal-close{width:36px;height:36px;border:1px solid var(--line);background:white;border-radius:9px;color:#62718b}.mobile-menu{display:none}.chart{height:90px;width:100%;display:block}.chart-label{font-size:10px;fill:#8b98ad}.footer{padding:14px 2px;color:var(--muted);font-size:11px}.hidden{display:none!important}

<aside class="side"><div class="brand"><span class="brand-mark">直</span><span>推广诊断工作台</span></div><div class="nav-label">分析目录</div><div id="nav"></div><div class="side-foot">本地生成 · 数据仅来自用户上传的报表</div></aside>
<main class="main"><header class="hero"><div class="topline"><div><div class="eyebrow">淘宝 / 天猫推广分析 · 本地单文件报告</div><h1>推广投产分析看板</h1><p id="hero-meta"></p></div><span class="badge" style="background:#ffffff2b;color:white">离线可查看</span></div></header><div id="app"></div><div class="footer">指标按当前所选单份报表汇总；不同维度报表属于并列观察口径，不能互相相加。直接 ROI = 直接成交金额 ÷ 花费，不代表利润。</div></main>
<div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true"><div class="modal"><div class="modal-head"><strong id="modal-title">悬浮查看</strong><button class="modal-close" id="modal-close" aria-label="关闭">×</button></div><div class="modal-body" id="modal-body"></div></div></div>
<script type="application/json" id="report-data">__REPORT_DATA__</script>
<script>
(()=>{'use strict';
const DATA=JSON.parse(document.getElementById('report-data').textContent), app=document.getElementById('app'), nav=document.getElementById('nav');
const fmt=(v,kind='number')=>{if(v===null||v===undefined||!Number.isFinite(Number(v)))return '—';const n=Number(v);if(kind==='money')return '¥'+n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});if(kind==='ratio')return n.toFixed(2)+'x';if(kind==='percent')return (n*100).toFixed(2)+'%';return n.toLocaleString('zh-CN',{maximumFractionDigits:2})};
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const metricLabels={impressions:'展现量',clicks:'点击量',spend:'花费',direct_amount:'直接成交金额',total_amount:'总成交金额',direct_orders:'直接成交笔数',total_orders:'总成交笔数',presale_direct_amount:'直接预售成交金额',presale_total_amount:'总预售成交金额',presale_direct_orders:'直接预售成交笔数',presale_total_orders:'总预售成交笔数',cart:'总购物车数',favorites:'收藏宝贝数',direct_roi:'直接 ROI',total_roi:'总 ROI',cpc:'平均点击花费',ctr:'点击率',direct_cvr:'直接成交转化率',direct_cpa:'直接成交 CPA'};
const metricKind=k=>k==='spend'||k.includes('amount')||k==='direct_cpa'?'money':['direct_roi','total_roi'].includes(k)?'ratio':['ctr','direct_cvr'].includes(k)?'percent':'number';
const dimsLabel=k=>DATA.dimension_labels[k]||k;
const state={page:'overview',filters:{},groups:{},metrics:{},sort:{key:'spend',dir:-1},modal:null};
const datasetById=id=>DATA.datasets.find(d=>d.id===id);
const defaultMetrics=d=>[...(d.available_metrics||[]),'direct_roi','total_roi','cpc','ctr','direct_cvr','direct_cpa'].filter((v,i,a)=>a.indexOf(v)===i);
function navItem(key,label,num){const b=document.createElement('button');b.className='nav'+(state.page===key?' active':'');b.innerHTML=`<span class="num">${num||''}</span><span>${escapeHtml(label)}</span>`;b.onclick=()=>{state.page=key;render()};nav.appendChild(b)}
function renderNav(){nav.innerHTML='';navItem('overview','总览','01');navItem('links','商品 × 计划关联','02');navItem('quality','数据质量','03');DATA.datasets.forEach((d,i)=>navItem(d.id,`${d.label}报表`,String(i+4).padStart(2,'0')))}
function cards(totals){const items=[['spend','花费','money'],['direct_amount','直接成交金额','money'],['total_amount','总成交金额','money'],['direct_orders','直接成交笔数','number'],['impressions','展现量','number'],['clicks','点击量','number'],['direct_roi','直接 ROI','ratio'],['total_roi','总 ROI','ratio'],['direct_cpa','直接 CPA','money'],['ctr','点击率','percent'],['cpc','平均点击花费','money'],['direct_cvr','直接转化率','percent']];return `<div class="kpis">${items.filter(([key])=>Object.hasOwn(totals,key)).map(([key,label,kind])=>`<div class="kpi"><label>${label}</label><strong>${fmt(totals[key],kind)}</strong></div>`).join('')}</div>`}
function findingCards(items){return `<div class="findings">${items.map(f=>`<div class="finding ${escapeHtml(f.level)}"><strong><span class="badge ${escapeHtml(f.level)}">${f.level==='alert'?'异常':f.level==='watch'?'关注':f.level==='good'?'正常规则':'提示'}</span> ${escapeHtml(f.title)}</strong><p>${escapeHtml(f.detail)}</p></div>`).join('')}</div>`}
function chartSvg(dataset){const byDate=new Map();dataset.rows.forEach(r=>{const day=r.dimensions.date;if(day&&Number.isFinite(r.metrics.spend))byDate.set(day,(byDate.get(day)||0)+r.metrics.spend)});const days=[...byDate.keys()].sort(),vals=days.map(day=>byDate.get(day));if(vals.length<2)return '<div class="empty">日期记录不足，暂不绘制趋势</div>';const w=900,h=88,p=6,max=Math.max(...vals)||1,pts=vals.map((v,i)=>`${p+i*(w-2*p)/(vals.length-1)},${h-p-v/max*(h-2*p)}`).join(' ');return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#4c68f5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${vals.map((v,i)=>`<circle cx="${p+i*(w-2*p)/(vals.length-1)}" cy="${h-p-v/max*(h-2*p)}" r="3.5" fill="#4c68f5"/>`).join('')}</svg><div class="small-note">${escapeHtml(days[0])} 至 ${escapeHtml(days.at(-1))} · ${days.length} 个有记录日期</div>`}
function renderOverview(){const primary=DATA.datasets.find(d=>d.type==='product')||DATA.datasets.find(d=>d.type==='plan')||DATA.datasets[0];if(!primary){app.innerHTML='<div class="panel">没有可展示的报表。</div>';return}const totals={};primary.rows.forEach(r=>Object.entries(r.metrics).forEach(([k,v])=>{if(v!==null)totals[k]=(totals[k]||0)+v}));totals.direct_roi=totals.spend&&Object.hasOwn(totals,'direct_amount')?totals.direct_amount/totals.spend:null;totals.total_roi=totals.spend&&Object.hasOwn(totals,'total_amount')?totals.total_amount/totals.spend:null;totals.cpc=totals.clicks&&Object.hasOwn(totals,'spend')?totals.spend/totals.clicks:null;totals.ctr=totals.impressions&&Object.hasOwn(totals,'clicks')?totals.clicks/totals.impressions:null;totals.direct_cvr=totals.clicks&&Object.hasOwn(totals,'direct_orders')?totals.direct_orders/totals.clicks:null;totals.direct_cpa=totals.direct_orders&&Object.hasOwn(totals,'spend')?totals.spend/totals.direct_orders:null;const dateList=primary.rows.map(r=>r.dimensions.date).filter(Boolean).sort();const range=dateList.length?`${dateList[0]} 至 ${dateList.at(-1)}`:'日期未识别';app.innerHTML=`<section class="panel"><div class="section-title"><div><h2>经营摘要</h2><p class="sub">主视图按${escapeHtml(primary.label)}报表汇总；周期 ${range}；${primary.row_count.toLocaleString()} 条源记录。</p></div></div>${DATA.warnings.length?`<div class="notice">导入提示：${DATA.warnings.map(escapeHtml).join('；')}</div>`:''}${cards(totals)}<div class="two"><div class="panel"><h2>每日花费趋势</h2><p class="sub">按源报表日期聚合，仅作为趋势观察。</p>${chartSvg(primary)}</div><div class="panel"><h2>基础诊断</h2><p class="sub">规则仅提示异常信号，不替代利润与归因核算。</p>${findingCards(DATA.diagnostics[primary.id]||[])}</div></div></section><section class="panel"><div class="section-title"><div><h2>报表覆盖</h2><p class="sub">各份报表保持独立口径，不将并列维度重复累加。</p></div></div>${DATA.datasets.map(d=>`<div class="link-row"><div><div class="link-name">${escapeHtml(d.label)}报表</div><div class="link-sub">${escapeHtml(d.source_file)} · ${d.row_count.toLocaleString()} 行</div></div><div>日期 ${escapeHtml(d.date_start||'—')} 至 ${escapeHtml(d.date_end||'—')}</div><div>可用维度 ${d.dimensions_available.length}</div><div>核心指标 ${d.available_metrics.length}</div><button class="btn" onclick="window.openDataset('${escapeHtml(d.id)}')">查看明细</button></div>`).join('')}</section>`}
function filteredData(d){const f=state.filters[d.id]||{},customMeta=d.custom_metric_meta||{};const selected=d.rows.filter(r=>{const dims=r.dimensions;for(const [key,val]of Object.entries(f)){if(!val)continue;if(key==='search'){if(!Object.values(dims).some(v=>String(v||'').toLowerCase().includes(val.toLowerCase())))return false}else if(key==='date_start'&&(!dims.date||dims.date<val))return false;else if(key==='date_end'&&(!dims.date||dims.date>val))return false;else if(key!=='date_start'&&key!=='date_end'&&!String(dims[key]||'').toLowerCase().includes(val.toLowerCase()))return false}return true});const groups=state.groups[d.id]||[];const map=new Map();selected.forEach(r=>{const key=groups.map(g=>r.dimensions[g]||'').join('\u001f')||'__all__';if(!map.has(key))map.set(key,{dimensions:Object.fromEntries(groups.map(g=>[g,r.dimensions[g]])),metrics:{},custom_metrics:{},custom_sums:{},custom_counts:{},source_rows:0});const t=map.get(key);t.source_rows++;Object.entries(r.metrics).forEach(([k,v])=>{if(v!==null)t.metrics[k]=(t.metrics[k]||0)+v});Object.entries(r.custom_metrics||{}).forEach(([k,v])=>{t.custom_sums[k]=(t.custom_sums[k]||0)+v;t.custom_counts[k]=(t.custom_counts[k]||0)+1})});map.forEach(r=>{const m=r.metrics;m.direct_roi=m.spend&&Object.hasOwn(m,'direct_amount')?m.direct_amount/m.spend:null;m.total_roi=m.spend&&Object.hasOwn(m,'total_amount')?m.total_amount/m.spend:null;m.cpc=m.clicks&&Object.hasOwn(m,'spend')?m.spend/m.clicks:null;m.ctr=m.impressions&&Object.hasOwn(m,'clicks')?m.clicks/m.impressions:null;m.direct_cvr=m.clicks&&Object.hasOwn(m,'direct_orders')?m.direct_orders/m.clicks:null;m.direct_cpa=m.direct_orders&&Object.hasOwn(m,'spend')?m.spend/m.direct_orders:null;Object.entries(r.custom_sums).forEach(([k,sum])=>{r.custom_metrics[k]=customMeta[k]?.aggregation==='mean'?sum/r.custom_counts[k]:sum})});let out=[...map.values()];const sort=state.sort[d.id]||{key:'spend',dir:-1};out.sort((a,b)=>{const av=a.dimensions[sort.key]??a.metrics[sort.key]??a.custom_metrics[sort.key.replace(/^custom:/,'')],bv=b.dimensions[sort.key]??b.metrics[sort.key]??b.custom_metrics[sort.key.replace(/^custom:/,'')];const n=Number(av)-Number(bv);return Number.isNaN(n)?String(av??'').localeCompare(String(bv??''),'zh-CN')*sort.dir:n*sort.dir});const totals={};selected.forEach(r=>Object.entries(r.metrics).forEach(([k,v])=>{if(v!==null)totals[k]=(totals[k]||0)+v}));totals.direct_roi=totals.spend&&Object.hasOwn(totals,'direct_amount')?totals.direct_amount/totals.spend:null;totals.total_roi=totals.spend&&Object.hasOwn(totals,'total_amount')?totals.total_amount/totals.spend:null;totals.cpc=totals.clicks&&Object.hasOwn(totals,'spend')?totals.spend/totals.clicks:null;totals.ctr=totals.impressions&&Object.hasOwn(totals,'clicks')?totals.clicks/totals.impressions:null;totals.direct_cvr=totals.clicks&&Object.hasOwn(totals,'direct_orders')?totals.direct_orders/totals.clicks:null;totals.direct_cpa=totals.direct_orders&&Object.hasOwn(totals,'spend')?totals.spend/totals.direct_orders:null;return{selected,out,totals,groups,sort}}
function renderDataset(d){const f=state.filters[d.id]||(state.filters[d.id]={}), available=d.dimensions_available.filter(k=>!['date'].includes(k)), customMeta=d.custom_metric_meta||{};const defaultGroups=(d.type==='product'?['product_id','product_name','plan_name','scene_name']:d.type==='keyword'?['keyword_type','keyword_name','product_name','plan_name']:({plan:['plan_id','plan_name','scene_name'],scene:['scene_id','scene_name'],audience:['audience_name','plan_name'],creative:['creative_name','plan_name'],region:['province','plan_name'],unit:['unit_name','plan_name']}[d.type]||[])).filter(k=>available.includes(k));if(!state.groups[d.id])state.groups[d.id]=defaultGroups.length?defaultGroups:[...available.slice(0,1)];if(!state.metrics[d.id])state.metrics[d.id]=defaultMetrics(d);const v=filteredData(d),metricKeys=state.metrics[d.id],colDefs=[...v.groups.map(k=>({key:k,label:dimsLabel(k),kind:'dim'})),...metricKeys.filter(k=>!k.startsWith('custom:')).map(k=>({key:k,label:metricLabels[k]||k,kind:'metric',format:metricKind(k)})),...((d.available_custom_metrics||[]).filter(k=>metricKeys.includes('custom:'+k)).map(k=>({key:'custom:'+k,label:k+(customMeta[k]?.aggregation==='mean'?'（均值）':'（合计）'),kind:'custom',format:customMeta[k]?.format||'number'})))];
const groupControls=available.map(k=>`<label><input type="checkbox" data-group="${escapeHtml(k)}" ${v.groups.includes(k)?'checked':''}>${escapeHtml(dimsLabel(k))}</label>`).join('');const metricOptions=[...defaultMetrics(d),...(d.available_custom_metrics||[]).map(k=>'custom:'+k)];const metricControls=metricOptions.map(k=>`<label><input type="checkbox" data-metric="${escapeHtml(k)}" ${metricKeys.includes(k)?'checked':''}>${escapeHtml(k.startsWith('custom:')?k.slice(7)+(customMeta[k.slice(7)]?.aggregation==='mean'?'（均值）':'（合计）'):metricLabels[k]||k)}</label>`).join('');const filters=available.map(k=>`<input class="field" data-filter="${escapeHtml(k)}" placeholder="筛选${escapeHtml(dimsLabel(k))}" value="${escapeHtml(f[k]||'')}" style="width:150px">`).join('');
app.innerHTML=`<section class="panel"><div class="section-title"><div><h2>${escapeHtml(d.label)}报表分析</h2><p class="sub">来源：${escapeHtml(d.source_file)} · ${d.row_count.toLocaleString()} 行 · 日期 ${escapeHtml(d.date_start||'—')} 至 ${escapeHtml(d.date_end||'—')}</p></div><button class="btn primary" id="float-open">⛶ 悬浮查看</button></div>${d.warnings.length?`<div class="notice">${d.warnings.map(escapeHtml).join('；')}</div>`:''}<div class="filterbar"><input class="field search" data-filter="search" placeholder="搜索名称、ID 或维度值" value="${escapeHtml(f.search||'')}"><input class="field" type="date" data-filter="date_start" value="${escapeHtml(f.date_start||'')}"><span class="meta">至</span><input class="field" type="date" data-filter="date_end" value="${escapeHtml(f.date_end||'')}">${filters}<button class="btn primary" id="apply-filter">应用筛选</button><button class="btn" id="reset-filter">清除筛选</button></div><div class="meta">分组字段（勾选可组合）</div><div class="filters-grid" id="group-controls">${groupControls||'<span class="meta">本报表没有可分组的已识别维度</span>'}</div><div class="meta">展示指标（可自定义）</div><div class="filters-grid" id="metric-controls">${metricControls}</div>${cards(v.totals)}<div class="notice">当前筛选 ${v.selected.length.toLocaleString()} 行，按所选维度汇总为 ${v.out.length.toLocaleString()} 项。比率会在汇总后重算；不把其他报表口径叠加进来。</div><div class="table-wrap" id="dataset-table-wrap">${tableHtml(v.out,colDefs,v.sort)}</div><div class="small-note">点击表头切换排序。缺失值显示为“—”；关联仅在源报表提供精确 ID 时建立。</div></section><section class="panel"><h2>基础诊断</h2><p class="sub">基于此报表及当前筛选结果的简单规则提示。</p>${findingCards(diagnosticsFor(v.totals))}</section>`;
app.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('input',()=>{f[el.dataset.filter]=el.value}));app.querySelector('#apply-filter').onclick=()=>renderDataset(d);app.querySelectorAll('[data-group]').forEach(el=>el.onchange=()=>{const values=[...app.querySelectorAll('[data-group]:checked')].map(x=>x.dataset.group);state.groups[d.id]=values;renderDataset(d)});app.querySelectorAll('[data-metric]').forEach(el=>el.onchange=()=>{const values=[...app.querySelectorAll('[data-metric]:checked')].map(x=>x.dataset.metric);state.metrics[d.id]=values;renderDataset(d)});app.querySelector('#reset-filter').onclick=()=>{state.filters[d.id]={};renderDataset(d)};app.querySelector('#float-open').onclick=()=>openFloat(d,colDefs,v);bindSort(d,colDefs,v.out);}
function diagnosticsFor(t){const spend=t.spend,amount=t.direct_amount,clicks=t.clicks,orders=t.direct_orders,hasSpend=Number.isFinite(spend),hasAmount=Number.isFinite(amount),hasClicks=Number.isFinite(clicks),hasOrders=Number.isFinite(orders),items=[];if(hasSpend&&hasAmount&&spend>0&&amount===0)items.push({level:'alert',title:'有花费但无直接成交金额',detail:'当前筛选范围内花费大于 0、直接成交金额为 0；建议检查点击、转化和归因窗口。'});if(hasClicks&&hasOrders&&clicks>0&&orders===0)items.push({level:'watch',title:'有点击但无直接成交笔数',detail:'当前范围有点击但没有直接成交笔数；可以继续检查词、商品、计划或其他已导出维度。'});if(hasSpend&&hasAmount&&spend>0&&amount/spend<1)items.push({level:'watch',title:'直接 ROI 低于 1',detail:'该比值不等于利润率，需结合毛利和退款判断。'});if(hasSpend&&hasClicks&&spend===0&&clicks===0)items.push({level:'info',title:'当前范围没有投放消耗',detail:'请检查筛选区间及报表范围。'});if(!items.length)items.push({level:'good',title:'未触发基础异常规则',detail:'此结果只表示没有命中当前简单规则。'});return items}
function tableHtml(rows,cols,sort){if(!rows.length)return '<div class="empty">没有符合筛选条件的记录</div>';return `<table class="data-table"><thead><tr>${cols.map(c=>`<th class="${c.kind==='dim'?'dim':''} sort" data-sort="${escapeHtml(c.key)}">${escapeHtml(c.label)} ${sort.key===c.key?(sort.dir===1?'↑':'↓'):'↕'}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>{if(c.kind==='dim')return `<td class="dim">${escapeHtml(r.dimensions[c.key]??'—')}</td>`;const val=c.kind==='custom'?r.custom_metrics[c.key.slice(7)]:r.metrics[c.key];let klass='';if(c.key==='direct_roi'&&Number.isFinite(val))klass=val>=1?'metric-good':'metric-bad';return `<td class="${klass}">${fmt(val,c.format||metricKind(c.key))}</td>`}).join('')}</tr>`).join('')}</tbody></table>`}
function bindSort(d,cols,rows){app.querySelectorAll('[data-sort]').forEach(th=>th.onclick=()=>{const k=th.dataset.sort;const s=state.sort[d.id]||{key:'spend',dir:-1};state.sort[d.id]={key:k,dir:s.key===k?-s.dir:-1};renderDataset(d)})}
function openFloat(d,cols,v){const body=document.getElementById('modal-body');function fill(){const current=filteredData(d);document.getElementById('modal-title').textContent=`${d.label}报表分析 · ${current.out.length} 项`;body.innerHTML=`<div class="meta" style="margin-bottom:10px">悬浮查看支持独立滚动；表头固定，方便核对每列指标。</div><div class="table-wrap">${tableHtml(current.out,cols,current.sort)}</div>`;body.querySelectorAll('[data-sort]').forEach(th=>th.onclick=()=>{const k=th.dataset.sort;const s=state.sort[d.id]||{key:'spend',dir:-1};state.sort[d.id]={key:k,dir:s.key===k?-s.dir:-1};renderDataset(d);fill()})}fill();document.getElementById('modal-backdrop').classList.add('open')}
function renderLinks(){const links=DATA.product_plan_links||[];app.innerHTML=`<section class="panel"><div class="section-title"><div><h2>商品 × 计划关联</h2><p class="sub">只根据商品报表中的商品 ID + 计划 ID 建立精确关系；商品报表不可用时才使用关键词报表作关联线索。</p></div></div><div class="filterbar"><input class="field search" id="link-search" placeholder="搜索商品名称、商品 ID、计划名称或计划 ID"><button class="btn primary" id="links-float">⛶ 悬浮查看</button></div><div class="notice">关联金额来自单一来源报表：${links.length?escapeHtml(links[0].evidence_reports.join('、')):'没有可用的精确商品×计划 ID 关联'}。人群、地域、场景、创意和单元报表不含商品 ID 时，不会推断到商品。</div><div id="links-list" class="links-list"></div></section>`;const list=app.querySelector('#links-list');function draw(q=''){const filtered=links.filter(x=>(x.product_id+x.product_name+x.plan_id+x.plan_name).toLowerCase().includes(q.toLowerCase()));list.innerHTML=filtered.length?filtered.map(x=>`<div class="link-row"><div><div class="link-name">${escapeHtml(x.product_name||'未命名商品')}</div><div class="link-sub">商品 ID ${escapeHtml(x.product_id)}</div></div><div><div class="link-name">${escapeHtml(x.plan_name||'未命名计划')}</div><div class="link-sub">计划 ID ${escapeHtml(x.plan_id)}</div></div><div>花费<br><b>${fmt(x.metrics.spend,'money')}</b></div><div>直接成交<br><b>${fmt(x.metrics.direct_amount,'money')}</b></div><div>直接 ROI<br><b class="${x.metrics.direct_roi===null?'':x.metrics.direct_roi>=1?'metric-good':'metric-bad'}">${fmt(x.metrics.direct_roi,'ratio')}</b></div><span class="badge">${escapeHtml(x.evidence_reports.join('、'))}</span></div>`).join(''):'<div class="empty">没有找到带商品 ID 和计划 ID 的精确关联行。</div>'}app.querySelector('#link-search').oninput=e=>draw(e.target.value);draw();app.querySelector('#links-float').onclick=()=>{document.getElementById('modal-title').textContent=`商品 × 计划关联 · ${links.length} 项`;document.getElementById('modal-body').innerHTML=list.innerHTML;document.getElementById('modal-backdrop').classList.add('open')}}
function renderQuality(){app.innerHTML=`<section class="panel"><h2>数据质量与口径</h2><p class="sub">每个来源文件按自己的字段和粒度独立检查。</p>${DATA.warnings.length?`<div class="notice">导入过程提示：${DATA.warnings.map(escapeHtml).join('；')}</div>`:'<div class="notice">导入过程中没有跳过或报错的文件。</div>'}${DATA.datasets.map(d=>`<div class="panel"><div class="section-title"><div><h2>${escapeHtml(d.label)}报表 · ${escapeHtml(d.source_file)}</h2><p class="sub">${d.row_count.toLocaleString()} 行 · ${escapeHtml(d.date_start||'无日期')} 至 ${escapeHtml(d.date_end||'无日期')} · 维度：${d.dimensions_available.map(dimsLabel).map(escapeHtml).join('、')||'未识别'}</p></div><span class="badge">${d.available_metrics.length} 个指标字段</span></div>${d.warnings.length?findingCards(d.warnings.map(x=>({level:'watch',title:'字段提示',detail:x}))):'<div class="finding good"><strong>基础字段检查通过</strong><p>已识别日期、维度和指标列。</p></div>'}<div class="small-note">源字段：${d.source_headers.map(escapeHtml).join('、')}</div></div>`).join('')}<div class="notice">直接 ROI 是报表直接成交金额 ÷ 花费，仅用于观察投放产出；它不代表净利润。预售金额、总成交和直接成交保持各自字段，不混算。</div></section>`}
