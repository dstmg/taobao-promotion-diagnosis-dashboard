<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">淘宝天猫推广报表本地分析流程</title>
  <desc id="desc">从 ZIP、CSV、XLSX 报表到本地指标校验、维度关联和交互式 HTML 看板的流程图。</desc>
  <defs>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#4267ff"/><stop offset="1" stop-color="#6e7cff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#8ea4d4" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1200" height="520" rx="30" fill="#f4f6ff"/>
  <rect x="24" y="24" width="1152" height="472" rx="26" fill="#fff" stroke="#e0e7fb"/>
  <text x="64" y="78" fill="#536fff" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" letter-spacing="2">TAOBAO / TMALL · LOCAL ANALYSIS</text>
  <text x="64" y="126" fill="#172033" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="32" font-weight="700">从推广报表，到可操作的诊断看板</text>
  <text x="64" y="158" fill="#77829a" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16">把分散报表放在一起核口径、看表现、找机会，结果以单文件 HTML 交付。</text>

  <g filter="url(#shadow)">
    <rect x="64" y="198" width="292" height="210" rx="20" fill="#fff" stroke="#e2e8f6"/>
    <rect x="454" y="198" width="292" height="210" rx="20" fill="#fff" stroke="#dce4ff"/>
    <rect x="844" y="198" width="292" height="210" rx="20" fill="#fff" stroke="#e2e8f6"/>
  </g>
  <circle cx="104" cy="242" r="23" fill="#edf1ff"/><text x="104" y="250" text-anchor="middle" fill="#536fff" font-family="Arial,sans-serif" font-size="21" font-weight="700">1</text>
  <text x="140" y="249" fill="#172033" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700">导入报表</text>
  <text x="88" y="296" fill="#53617b" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16">商品 · 计划 · 场景 · 人群</text>
  <text x="88" y="326" fill="#53617b" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16">创意 · 地域 · 单元 · 关键词</text>
  <g transform="translate(88 354)"><rect width="68" height="28" rx="8" fill="#f0f3ff"/><text x="34" y="19" text-anchor="middle" fill="#536fff" font-family="Arial,sans-serif" font-size="12" font-weight="700">ZIP</text><rect x="80" width="68" height="28" rx="8" fill="#f0f3ff"/><text x="114" y="19" text-anchor="middle" fill="#536fff" font-family="Arial,sans-serif" font-size="12" font-weight="700">CSV</text><rect x="160" width="68" height="28" rx="8" fill="#f0f3ff"/><text x="194" y="19" text-anchor="middle" fill="#536fff" font-family="Arial,sans-serif" font-size="12" font-weight="700">XLSX</text></g>

  <circle cx="494" cy="242" r="23" fill="#536fff"/><text x="494" y="250" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="21" font-weight="700">2</text>
  <text x="530" y="249" fill="#172033" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700">本地分析</text>
  <text x="478" y="296" fill="#53617b" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16">字段识别与指标口径校验</text>
  <text x="478" y="326" fill="#53617b" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16">按真实 ID 关联 · 标注数据缺口</text>
  <rect x="478" y="354" width="224" height="30" rx="9" fill="#f0f3ff"/><text x="590" y="374" text-anchor="middle" fill="#536fff" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="13" font-weight="700">不跨报表猜测，不把缺失当 0</text>

  <circle cx="884" cy="242" r="23" fill="#edf1ff"/><text x="884" y="250" text-anchor="middle" fill="#536fff" font-family="Arial,sans-serif" font-size="21" font-weight="700">3</text>
  <text x="920" y="249" fill="#172033" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700">查看看板</text>
  <text x="868" y="296" fill="#53617b" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16">趋势 · 诊断 · 多维明细</text>
  <text x="868" y="326" fill="#53617b" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16">筛选 · 排序 · 自定义指标</text>
  <rect x="868" y="354" width="224" height="30" rx="9" fill="#f0f3ff"/><text x="980" y="374" text-anchor="middle" fill="#536fff" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="13" font-weight="700">生成一份可交互的 HTML</text>

  <path d="M370 303h67m-10-9 10 9-10 9M760 303h67m-10-9 10 9-10 9" fill="none" stroke="#8798c8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="64" y="438" width="1072" height="36" rx="12" fill="#f1f4ff"/>
  <circle cx="86" cy="456" r="5" fill="#536fff"/>
  <text x="102" y="462" fill="#485777" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14">本机读取源文件</text>
  <circle cx="270" cy="456" r="3" fill="#b2bdd6"/><text x="286" y="462" fill="#485777" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14">不连接商家账号</text>
  <circle cx="470" cy="456" r="3" fill="#b2bdd6"/><text x="486" y="462" fill="#485777" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14">不调用平台接口</text>
  <circle cx="660" cy="456" r="3" fill="#b2bdd6"/><text x="676" y="462" fill="#485777" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14">不上传报表</text>
</svg>
