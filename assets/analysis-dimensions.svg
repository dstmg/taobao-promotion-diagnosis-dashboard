<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">推广看板支持的八类报表维度</title>
  <desc id="desc">商品、计划、营销场景、人群、创意、地域、单元和关键词八类报表维度，按实际报表提供的信息做筛选和关联。</desc>
  <rect width="1200" height="560" rx="30" fill="#f4f6ff"/>
  <rect x="24" y="24" width="1152" height="512" rx="26" fill="#fff" stroke="#e0e7fb"/>
  <text x="64" y="80" fill="#536fff" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" letter-spacing="2">REPORT DIMENSIONS</text>
  <text x="64" y="126" fill="#172033" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700">围绕投放对象，拆开看每一层表现</text>
  <text x="64" y="157" fill="#77829a" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16">不同报表各看各的口径；仅在原始报表含有精确 ID 时建立关联。</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <g transform="translate(64 196)"><rect width="254" height="118" rx="18" fill="#fff" stroke="#e0e7fb"/><rect x="18" y="18" width="40" height="40" rx="12" fill="#edf1ff"/><text x="38" y="45" text-anchor="middle" fill="#536fff" font-size="17" font-weight="700">01</text><text x="74" y="42" fill="#172033" font-size="19" font-weight="700">商品</text><text x="18" y="86" fill="#77829a" font-size="14">看商品花费、成交与投产</text></g>
    <g transform="translate(334 196)"><rect width="254" height="118" rx="18" fill="#fff" stroke="#e0e7fb"/><rect x="18" y="18" width="40" height="40" rx="12" fill="#edf1ff"/><text x="38" y="45" text-anchor="middle" fill="#536fff" font-size="17" font-weight="700">02</text><text x="74" y="42" fill="#172033" font-size="19" font-weight="700">计划</text><text x="18" y="86" fill="#77829a" font-size="14">比较不同计划的产出和效率</text></g>
    <g transform="translate(604 196)"><rect width="254" height="118" rx="18" fill="#fff" stroke="#e0e7fb"/><rect x="18" y="18" width="40" height="40" rx="12" fill="#edf1ff"/><text x="38" y="45" text-anchor="middle" fill="#536fff" font-size="17" font-weight="700">03</text><text x="74" y="42" fill="#172033" font-size="19" font-weight="700">营销场景</text><text x="18" y="86" fill="#77829a" font-size="14">拆分场景表现，不重复计入计划</text></g>
    <g transform="translate(874 196)"><rect width="254" height="118" rx="18" fill="#fff" stroke="#e0e7fb"/><rect x="18" y="18" width="40" height="40" rx="12" fill="#edf1ff"/><text x="38" y="45" text-anchor="middle" fill="#536fff" font-size="17" font-weight="700">04</text><text x="74" y="42" fill="#172033" font-size="19" font-weight="700">人群</text><text x="18" y="86" fill="#77829a" font-size="14">观察人群粒度和成交效率</text></g>
    <g transform="translate(64 334)"><rect width="254" height="118" rx="18" fill="#fff" stroke="#e0e7fb"/><rect x="18" y="18" width="40" height="40" rx="12" fill="#edf1ff"/><text x="38" y="45" text-anchor="middle" fill="#536fff" font-size="17" font-weight="700">05</text><text x="74" y="42" fill="#172033" font-size="19" font-weight="700">创意</text><text x="18" y="86" fill="#77829a" font-size="14">查看创意维度的点击与转化</text></g>
    <g transform="translate(334 334)"><rect width="254" height="118" rx="18" fill="#fff" stroke="#e0e7fb"/><rect x="18" y="18" width="40" height="40" rx="12" fill="#edf1ff"/><text x="38" y="45" text-anchor="middle" fill="#536fff" font-size="17" font-weight="700">06</text><text x="74" y="42" fill="#172033" font-size="19" font-weight="700">地域</text><text x="18" y="86" fill="#77829a" font-size="14">定位地域差异，辅助预算调整</text></g>
    <g transform="translate(604 334)"><rect width="254" height="118" rx="18" fill="#fff" stroke="#e0e7fb"/><rect x="18" y="18" width="40" height="40" rx="12" fill="#edf1ff"/><text x="38" y="45" text-anchor="middle" fill="#536fff" font-size="17" font-weight="700">07</text><text x="74" y="42" fill="#172033" font-size="19" font-weight="700">单元</text><text x="18" y="86" fill="#77829a" font-size="14">识别单元级的消耗与产出</text></g>
    <g transform="translate(874 334)"><rect width="254" height="118" rx="18" fill="#fff" stroke="#e0e7fb"/><rect x="18" y="18" width="40" height="40" rx="12" fill="#edf1ff"/><text x="38" y="45" text-anchor="middle" fill="#536fff" font-size="17" font-weight="700">08</text><text x="74" y="42" fill="#172033" font-size="19" font-weight="700">关键词</text><text x="18" y="86" fill="#77829a" font-size="14">筛选关键词并比较转化表现</text></g>
  </g>
  <rect x="64" y="476" width="1072" height="38" rx="12" fill="#f1f4ff"/>
  <text x="84" y="501" fill="#536fff" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="700">关联规则</text>
  <text x="166" y="501" fill="#485777" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14">根据报表中的商品 ID、计划 ID 等字段精确匹配；缺少 ID 时保留为独立维度，不推断归属。</text>
</svg>
