[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taobao-promotion-diagnosis-dashboard"
version = "0.2.0"
description = "Local analysis and interactive dashboard for Taobao promotion reports"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["openpyxl==3.1.5", "et-xmlfile==2.0.0", "defusedxml==0.7.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
promo_dashboard = ["report-template.html", "dashboard.js", "dashboard.css"]
